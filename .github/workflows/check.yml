# Runs on every pull request and every push to main. A red check means the change
# breaks something that has broken before; read the failing line before merging.
name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Security policy hashes are current
        run: python3 tools/csp.py index.html --check
      - name: Install Chromium
        run: |
          pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Regression check
        run: python3 tools/check/check.py
